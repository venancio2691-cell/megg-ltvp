<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEGG LTVP</title>
<meta name="theme-color" content="#012f66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEGG LTVP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ferramenta de campo: painel claro, tinta azul-petróleo, semáforo de prioridade separado do acento. */
  --bg:#f2f3f5; --panel:#ffffff; --ink:#1a2435; --muted:#6a6d73; --line:#d6d8dc;
  --accent:#012f66; --accent-ink:#ffffff; --soft:#e6ecf5; --orange:#fa851d; --grey:#818085;
  --p1:#b3261e; --p1-bg:#fbe9e7; --p2:#9a6100; --p2-bg:#fff3d6; --p3:#2e6b2f; --p3-bg:#e6f2e6;
  --ok:#2e6b2f; --warn:#9a6100; --bad:#b3261e;
  --display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121923; --panel:#1b2533; --ink:#e8ecef; --muted:#9aa5b1; --line:#2f3b4c;
  --accent:#6ea3e6; --accent-ink:#0b1626; --soft:#1e2e45; --orange:#fa851d; --grey:#a0a2a8;
  --p1:#ff8a80; --p1-bg:#3a1f1d; --p2:#ffcf6b; --p2-bg:#3a2e14; --p3:#8fd48f; --p3-bg:#1d2f1d;
  --ok:#8fd48f; --warn:#ffcf6b; --bad:#ff8a80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121923; --panel:#1b2533; --ink:#e8ecef; --muted:#9aa5b1; --line:#2f3b4c;
  --accent:#6ea3e6; --accent-ink:#0b1626; --soft:#1e2e45; --orange:#fa851d; --grey:#a0a2a8;
  --p1:#ff8a80; --p1-bg:#3a1f1d; --p2:#ffcf6b; --p2-bg:#3a2e14; --p3:#8fd48f; --p3-bg:#1d2f1d;
  --ok:#8fd48f; --warn:#ffcf6b; --bad:#ff8a80; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px} h4{font-size:14px;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:5;background:#012f66;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--orange)}
.topbar img.lg{height:30px;border-radius:3px;background:#fff;padding:2px}
.topbar h1{font-size:18px;flex:1;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:8px;padding:6px 10px;font-weight:600}
.topbar .brand{font-family:var(--display);font-weight:700;letter-spacing:.5px;font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px;min-width:0}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field{margin-bottom:10px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;padding:6px 0}
.check input{width:18px;height:18px}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--p1-bg);color:var(--p1)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.chip.p1{background:var(--p1-bg);color:var(--p1)} .chip.p2{background:var(--p2-bg);color:var(--p2)} .chip.p3{background:var(--p3-bg);color:var(--p3)}
.chip.ok{background:var(--p3-bg);color:var(--ok)} .chip.bad{background:var(--p1-bg);color:var(--bad)} .chip.warn{background:var(--p2-bg);color:var(--warn)}
.chip.n{background:var(--soft);color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.tabs button .n{font-family:var(--display);font-size:17px;line-height:1}
.tabs button.on{color:var(--accent)}
.tabs button.on .n{background:var(--orange);color:#fff;border-radius:6px;padding:0 6px}
.list-item{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-of-type{border-top:0}
.list-item .t{flex:1;min-width:0}
.list-item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sys{border-top:1px solid var(--line);padding:10px 0}
.sys:first-child{border-top:0}
.sys-head{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 0;text-align:left}
.sys-head h3{flex:1}
.sys-head .cnt{font-size:12px;color:var(--muted)}
.proc{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:6px 0}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.item .q{font-size:14px}
.item .q small{display:block;color:var(--muted);font-size:11.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;border-left:1px solid var(--line);padding:6px 9px;font-size:12px;font-weight:700;color:var(--muted);min-width:36px}
.seg button:first-child{border-left:0}
.seg button.C.on{background:var(--p3-bg);color:var(--ok)}
.seg button.NC.on{background:var(--p1-bg);color:var(--bad)}
.seg button.NA.on,.seg button.NV.on,.seg button.M.on{background:var(--soft);color:var(--accent)}
.item .obs{grid-column:1/-1}
.item .obs input{padding:6px 8px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.kpi b{font-family:var(--display);font-size:26px;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi.p1 b{color:var(--p1)} .kpi.p2 b{color:var(--p2)} .kpi.p3 b{color:var(--p3)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos .ph{position:relative;width:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.photos .ph img{width:100%;height:80px;object-fit:cover;display:block}
.photos .ph input{width:100%;border:0;border-top:1px solid var(--line);padding:4px;font-size:11px;background:var(--panel)}
.photos .ph button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1}
.addph{width:96px;height:104px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center}
.const{border-left:4px solid var(--line);padding:10px 12px;margin-bottom:10px;background:var(--panel);border-radius:0 var(--r) var(--r) 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.const.p1{border-left-color:var(--p1)} .const.p2{border-left-color:var(--p2)} .const.p3{border-left-color:var(--p3)}
.const .hd{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.const .hd b{flex:1}
.stripe{padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
.stripe.ok{background:var(--p3-bg);color:var(--ok)} .stripe.warn{background:var(--p2-bg);color:var(--warn)} .stripe.bad{background:var(--p1-bg);color:var(--bad)} .stripe.info{background:var(--soft);color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin-bottom:12px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);font-weight:600}
.tw{overflow-x:auto}
.laudo{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;font-size:13.5px}
.laudo h2{font-size:17px;margin:18px 0 6px;border-bottom:2px solid var(--orange);padding-bottom:3px}
.laudo h3{font-size:14px;margin:12px 0 4px}
.laudo p{margin:4px 0}
.laudo .ph-grid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.laudo .ph-grid figure{margin:0;width:150px;font-size:11px;color:var(--muted)}
.laudo .ph-grid img{width:150px;height:110px;object-fit:cover;border:1px solid var(--line);display:block}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gut{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gut label.f{margin-bottom:2px}
.score{font-family:var(--display);font-size:22px;font-weight:700}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:15}
.drawer{position:fixed;top:0;bottom:0;left:0;width:272px;max-width:85vw;background:var(--panel);border-right:1px solid var(--line);z-index:16;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
body.menu .drawer{transform:none} body.menu .drawer-bg{display:block}
.drawer .dh{padding:14px 16px 10px;border-bottom:3px solid var(--orange);display:flex;flex-direction:column;gap:6px;background:#012f66;color:#fff}
.drawer .dh img{width:150px;background:#fff;border-radius:4px;padding:3px}
.drawer button{background:none;border:0;text-align:left;padding:13px 16px;font-size:15px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line)}
.drawer button.on{color:var(--accent);background:var(--soft)}
.search{display:flex;gap:8px;margin-bottom:10px}.search input{flex:1}
.sig{max-height:60px;max-width:200px;display:block}
@media (prefers-reduced-motion: reduce){ .drawer{transition:none} }
.ai{border:1px dashed var(--accent);border-radius:var(--r);padding:10px 12px;margin:10px 0;background:var(--soft)}
.ai h4{color:var(--accent);margin-bottom:6px}
.ai .sug{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.ai .sug b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.ai .sug .actions{margin-top:6px}
.ai .sug .actions .btn{flex:0 0 auto;padding:6px 10px;font-size:12.5px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding:4px 0}
.chat .m{padding:8px 10px;border-radius:10px;font-size:13.5px;white-space:pre-wrap;max-width:92%}
.chat .m.u{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.chat .m.a{background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

const onlyDigits=s=>String(s||'').replace(/\D/g,'');
const fmtCNPJ=d=>{ d=onlyDigits(d); return d.length===14? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d; };
const fmtCPF=d=>{ d=onlyDigits(d); return d.length===11? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d; };
const fmtCEP=d=>{ d=onlyDigits(d); return d.length===8? d.replace(/(\d{5})(\d{3})/,'$1-$2'):d; };
function validCNPJ(c){ c=onlyDigits(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false; const calc=n=>{ let s=0,p=n-7; for(let i=n;i>=1;i--){ s+=c[n-i]*p--; if(p<2)p=9; } const r=s%11; return r<2?0:11-r; }; return calc(12)==c[12]&&calc(13)==c[13]; }
function validCPF(c){ c=onlyDigits(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false; const d=(n)=>{ let s=0; for(let i=0;i<n;i++) s+=c[i]*(n+1-i); const r=(s*10)%11; return (r===10?0:r); }; return d(9)==c[9]&&d(10)==c[10]; }

function enquadrar(im){
  const m=[]; const pav=+im.pavimentos||0, area=+im.area||0;
  if(im.uso==='uni'||im.uso==='bi') m.push('edificação residencial unifamiliar ou bifamiliar (Dec. 37.426, art. 1º §2º, I)');
  if(im.habitese){ const anos=(Date.now()-new Date(im.habitese))/31557600000; if(anos<5) m.push('menos de cinco anos desde o habite-se (art. 1º §2º, II)'); }
  if(pav>0 && pav<=2 && area>0 && area<1000) m.push('até dois pavimentos e área construída inferior a 1.000 m² (art. 1º §2º, III)');
  if(im.aeis) m.push('localizada em Área de Especial Interesse Social (art. 1º §2º, IV)');
  const exc = !!im.marquise;
  return {motivos:m, isento:m.length>0&&!exc, parcial:m.length>0&&exc, obrigatoria:m.length===0};
}
const gutScore = c=>(+c.G||1)*(+c.U||1)*(+c.T||1);
const gutPrio = s=> s>=64?1 : s>=27?2 : 3;
function resumo(v){
  const c=v.constatacoes; const p={1:0,2:0,3:0}; const rk={critico:0,regular:0,minimo:0}; const org={}; const porSis={};
  c.forEach(k=>{ p[k.prioridade]++; rk[k.risco]=(rk[k.risco]||0)+1; org[k.origem]=(org[k.origem]||0)+1; porSis[k.sistema]=(porSis[k.sistema]||0)+1; });
  let total=0,resp=0,nc=0,mon=0; SISTEMAS.forEach(s=>locaisDe(v,s).forEach(l=>s.itens.forEach((_,i)=>{ total++; const e=(v.check[ckey(s.id,i,l)]||{}).e; if(e) resp++; if(e==='NC') nc++; if(e==='M') mon++; })));
  const iminente=c.some(k=>k.iminente);
  const adequado = p[1]===0 && p[2]===0 && !iminente;
  const anosValidade = v.imovel.esportivo?2:5;
  const venc = v.dataVistoria? addYears(v.dataVistoria, anosValidade):'';
  const idade = v.imovel.ano? new Date().getFullYear()-(+v.imovel.ano):null;
  return {p,rk,org,porSis,total,resp,nc,mon,iminente,adequado,venc,anosValidade,idade};
}
function addYears(d,n){ const x=new Date(d+'T00:00:00'); x.setFullYear(x.getFullYear()+n); return x.toISOString().slice(0,10); }

function mapsURL(im){ return (im.lat&&im.lng)?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(im.lat+','+im.lng)}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(J(im.endereco,im.bairro,'Rio de Janeiro'))}`; }
function drawRT(){ const box=$('#rtList'); if(!box) return; const L=S.cur.equipeRT;
  box.innerHTML=L.map((r,i)=>`<div class="const" style="border-left-color:var(--accent)"><div class="row"><div class="field"><label class="f">Nome</label><input type="text" data-rt="${i}" data-k="nome" value="${esc(r.nome)}"></div><div class="field"><label class="f">Disciplina</label><select data-rt="${i}" data-k="area">${AREAS_RT.map(a=>`<option ${r.area===a?'selected':''}>${a}</option>`).join('')}</select></div></div>
   <div class="row"><div class="field"><label class="f">Título</label><input type="text" data-rt="${i}" data-k="titulo" value="${esc(r.titulo)}" placeholder="Engenheiro(a) Eletricista"></div><div class="field"><label class="f">Conselho / registro</label><input type="text" data-rt="${i}" data-k="registro" value="${esc(r.registro)}" placeholder="CREA-RJ 2019..."></div></div>
   <div class="row"><div class="field"><label class="f">ART / RRT</label><input type="text" data-rt="${i}" data-k="art" value="${esc(r.art)}"></div><div class="field"><label class="f">E-mail</label><input type="email" data-rt="${i}" data-k="email" value="${esc(r.email)}"></div></div>
   <div class="field"><label class="f">Sistemas sob sua responsabilidade</label><div class="badge-row">${SISTEMAS.map(s=>`<label class="chip n" style="cursor:pointer"><input type="checkbox" data-rts="${i}" data-s="${s.id}" ${(r.sistemas||[]).includes(s.id)?'checked':''}> ${s.nome}</label>`).join('')}</div></div>
   <div class="actions"><button class="btn danger" data-rtdel="${i}">Remover</button></div></div>`).join('')||'<p class="muted small">Nenhum profissional complementar.</p>';
  box.querySelectorAll('[data-rt]').forEach(el=>el.oninput=el.onchange=()=>{ L[+el.dataset.rt][el.dataset.k]=el.value; save(); });
  box.querySelectorAll('[data-rts]').forEach(el=>el.onchange=()=>{ const r=L[+el.dataset.rts]; r.sistemas=r.sistemas||[]; if(el.checked) r.sistemas.push(el.dataset.s); else r.sistemas=r.sistemas.filter(x=>x!==el.dataset.s); save(); });
  box.querySelectorAll('[data-rtdel]').forEach(b=>b.onclick=()=>{ L.splice(+b.dataset.rtdel,1); save(); drawRT(); });
  $('#addRT').onclick=()=>{ if(CAD.profissional.length){ pickCad('profissional','Profissional da equipe',p=>{ L.push({nome:p.nome,area:p.area,titulo:p.titulo,registro:p.conselho+' '+p.registro,art:p.artPadrao||'',email:p.email,sistemas:(p.sistemas||[]).slice(),profId:p.id}); save(); drawRT(); }); } else { L.push({nome:'',area:'Engenharia elétrica',titulo:'',registro:'',art:'',email:'',sistemas:[]}); save(); drawRT(); } };
}
function rtDoSistema(v,sid){ const r=(v.equipeRT||[]).find(x=>(x.sistemas||[]).includes(sid)); return r? J(r.nome,r.titulo,r.registro,'ART/RRT '+(r.art||'—')) : J(v.profissional.nome,v.profissional.titulo,v.profissional.conselho+' '+v.profissional.registro); }

function renderCheck(){

function photoBox(sel,arr,onChange){ const box=document.querySelector(sel); if(!box) return; const draw=()=>{ box.innerHTML=arr.map((p,i)=>`<div class="ph"><img src="${photoSrc(p)}" alt="Foto ${i+1}"><input type="text" placeholder="legenda" data-leg="${i}" value="${esc(p.leg||'')}"><button data-rm="${i}" aria-label="Remover">×</button></div>`).join('')+`<button class="addph">📷<br>Adicionar</button>`;
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ arr.splice(+b.dataset.rm,1); save(); draw(); onChange&&onChange(); });

    box.querySelector('.addph').onclick=()=>{ const fi=$('#fileIn'); fi.value=''; fi.onchange=async()=>{ const file=fi.files[0]; if(!file) return; try{ const data=await shrink(file); arr.push({data,leg:''}); save(); draw(); onChange&&onChange(); }catch(e){ toast('Não foi possível ler a imagem'); } }; fi.click(); }; }; draw(); }
function attachBox(sel,arr,label){ const box=document.querySelector(sel); if(!box) return; const draw=()=>{ box.innerHTML=arr.map((p,i)=>`<div class="ph">${p.type==='application/pdf'?`<div style="height:80px;display:flex;align-items:center;justify-content:center;font-size:11px;padding:4px;text-align:center;word-break:break-all">📄 ${esc(p.name||'PDF')}</div>`:`<img src="${photoSrc(p)}" alt="">`}<input type="text" placeholder="descrição" data-leg="${i}" value="${esc(p.leg||'')}"><button data-rm="${i}" aria-label="Remover">×</button></div>`).join('')+`<button class="addph">📎<br>${label||'Anexar'}</button>`;
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ arr.splice(+b.dataset.rm,1); save(); draw(); });
    box.querySelectorAll('[data-leg]').forEach(i=>i.oninput=()=>{ arr[+i.dataset.leg].leg=i.value; save(); });
    box.querySelector('.addph').onclick=()=>{ const fi=$('#docIn'); fi.value=''; fi.onchange=async()=>{ const file=fi.files[0]; if(!file) return; try{ if(file.type==='application/pdf'){ if(file.size>4*1024*1024){ toast('PDF acima de 4 MB; reduza o arquivo'); return; } const data=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(file); }); arr.push({data,type:'application/pdf',name:file.name,leg:''}); } else { const data=await shrink(file); arr.push({data,type:'image/jpeg',name:file.name,leg:''}); } save(); draw(); }catch(e){ toast('Não foi possível ler o arquivo'); } }; fi.click(); }; }; draw(); }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const M=1280; let w=img.width,h=img.height; const k=Math.min(1,M/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u); res(cv.toDataURL('image/jpeg',0.78)); }; img.onerror=rej; img.src=u; }); }

function laudoModel(v){
  const r=resumo(v), e=enquadrar(v.imovel), im=v.imovel, p=v.profissional, rs=v.responsavel, an=v.anamnese, mn=v.manut;
  const docsAus=DOCS.filter((_,i)=>v.docs[i]==='AUS').map(d=>d[0]), docsOk=DOCS.map((d,i)=>v.docs[i]==='OK'?d[0]+(v.docs['o'+i]?' ('+v.docs['o'+i]+')':''):null).filter(Boolean), docsNA=DOCS.filter((_,i)=>v.docs[i]==='NA').map(d=>d[0]);
  const sistemas=SISTEMAS.map(s=>{ const its=[]; locaisDe(v,s).forEach(l=>s.itens.forEach((it,i)=>its.push({it:(l!=='Geral'?'['+l+'] ':'')+it[0],ref:it[1]||'',...(v.check[ckey(s.id,i,l)]||{e:'NV'})}))); const nc=its.filter(x=>x.e==='NC').length, mon=its.filter(x=>x.e==='M').length, nv=its.filter(x=>x.e==='NV'||!x.e).length, na=its.filter(x=>x.e==='NA').length; const sit= na===its.length?'não se aplica': nv===its.length?'não vistoriado': nc?'com não conformidades': mon?'conforme, com itens a monitorar': nv?'parcialmente vistoriado':'conforme'; return {nome:s.nome,ref:s.ref,its,nc,mon,nv,na,sit}; });
  const cons=v.constatacoes.slice().sort((a,b)=>a.prioridade-b.prioridade||gutScore(b)-gutScore(a));
  let fotoN=0; const reg=[]; const num=(arr,ctx)=>arr.forEach(f=>{ f._n=++fotoN; reg.push({src:photoSrc(f),n:f._n,ctx,leg:f.leg||''}); });
  num((im.mapa||[]).filter(f=>f.type!=='application/pdf'),'Localização (Google Maps)');
  num(im.fotos||[],'Identificação do imóvel');
  SISTEMAS.forEach(s=>num((v.fotosSis||{})[s.id]||[],'Vista geral – '+s.nome));
  cons.forEach((c,i)=>num(c.fotos||[],`Constatação ${i+1} – ${c.sistema}${c.local?' · '+c.local:''} (P${c.prioridade})`));
  const conclusao = (r.adequado

  box.innerHTML='<h4><span class="spin"></span> Analisando a constatação'+(c.fotos.length?' e '+c.fotos.length+' foto(s)':'')+'…</h4>';
  const prompt=`${AI_PAPEL}\n\nAnalise a constatação abaixo${c.fotos.length?' e as fotos anexas':''} e proponha o texto técnico completo. Responda SOMENTE com um objeto JSON com as chaves: descricao (descrição técnica da manifestação patológica, com extensão e características; 2-4 frases), causa (causa provável / mecanismo), consequencia (evolução se não tratada), origem (uma de: endogena, exogena, funcional, uso, operacao, manutencao, planejamento), norma (norma/legislação de referência não atendida, ex.: "NBR 13755"), requisito (requisito não atendido, 1 frase), G, U, T (inteiros 1-5 da matriz GUT), risco (critico|regular|minimo), prioridade (1|2|3 conforme NBR 16747), prazo (texto curto), reforma (true se a intervenção caracteriza reforma pela NBR 16280), recomendacao (serviços recomendados, método e norma de execução, 2-4 frases), verificar (lista de strings: o que o vistoriador ainda deve conferir em campo).\n\n${constCtx(S.cur,c)}`;
  try{ const r=await aiCall(prompt,{images:c.fotos.map(photoSrc).filter(Boolean),json:true});
    const F=[['descricao','Descrição'],['causa','Causa provável'],['consequencia','Consequência'],['origem','Origem'],['norma','Norma'],['requisito','Requisito'],['recomendacao','Recomendação'],['prazo','Prazo']];
    box.innerHTML=`<h4>Sugestões da IA (revise antes de aplicar)</h4>`+F.filter(f=>r[f[0]]).map(f=>`<div class="sug"><b>${f[1]}</b>${esc(f[0]==='origem'?(ORIGENS[r.origem]||r.origem):r[f[0]])}<div class="actions"><button class="btn sec" data-ap="${f[0]}">Aplicar</button></div></div>`).join('')
     +`<div class="sug"><b>Classificação</b>GUT G${r.G}×U${r.U}×T${r.T} = ${(r.G||1)*(r.U||1)*(r.T||1)} · risco ${RISCO[r.risco]?RISCO[r.risco].t:r.risco} · prioridade P${r.prioridade}${r.reforma?' · caracteriza reforma (NBR 16280)':''}<div class="actions"><button class="btn sec" data-ap="class">Aplicar classificação</button></div></div>`
     +(Array.isArray(r.verificar)&&r.verificar.length?`<div class="sug"><b>Verificar em campo</b><ul style="margin:0;padding-left:18px">${r.verificar.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'')
     +`<div class="actions"><button class="btn" data-ap="all">Aplicar tudo</button><button class="btn ghost" data-ap="close">Fechar</button></div>`;
    const apply=k=>{ if(k==='class'){ c.G=+r.G||c.G; c.U=+r.U||c.U; c.T=+r.T||c.T; if(RISCO[r.risco]) c.risco=r.risco; if([1,2,3].includes(+r.prioridade)) c.prioridade=+r.prioridade; c.reforma=!!r.reforma; } else if(k==='origem'){ if(ORIGENS[r.origem]) c.origem=r.origem; } else if(r[k]!==undefined) c[k]=String(r[k]); };
    box.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ap; if(k==='close'){ box.innerHTML=''; return; } if(k==='all'){ F.forEach(f=>apply(f[0])); apply('class'); } else apply(k); save(true); editConst(c.id); toast('Sugestão aplicada'); });
  }catch(e){ box.innerHTML=`<h4>Não foi possível</h4><p class="small">${esc(aiErr(e))}</p>`; }
}
function laudoTextoIA(v){ const m=laudoModel(v); const B=laudoBlocks(m,v).filter(b=>!b.imgs); const i=B.findIndex(b=>b.h2&&b.h2.startsWith('Anexo B')); return laudoTexto(i>0?B.slice(0,i):B).slice(0,180000); }
async function aiRevisarLaudo(){
  const v=S.cur; openSheet(`<h2>Revisão do laudo pela IA</h2><div class="ai" id="aiBox"><h4><span class="spin"></span> Lendo o laudo completo…</h4></div>`); const box=$('#aiBox');
  const prompt=`${AI_PAPEL}\n\nRevise o Laudo Técnico de Vistoria Predial abaixo como revisor técnico antes da assinatura. Responda SOMENTE com um objeto JSON com as chaves:\n- inconsistencias: lista de strings (contradições, itens NC sem constatação, classificação incoerente com a descrição, prazos incompatíveis com a prioridade, normas citadas erradas, dados faltantes obrigatórios como ART, ata, enquadramento);\n- pendencias_campo: lista de strings (o que ainda precisa ser vistoriado ou medido);\n- melhorias: lista de objetos {secao: string, texto: string} com reescritas sugeridas de trechos específicos (máx. 8);\n- conclusao: texto da conclusão técnica reescrito (3-6 frases, mantendo o resultado adequado/inadequado do laudo);\n- observacoes: observações finais do responsável técnico (2-5 frases: ressalvas, limitações, recomendações gerais);\n- resumo_executivo: 4-6 frases para o síndico, em linguagem acessível, com as prioridades 1 e os prazos.\n\nLAUDO:\n${laudoTextoIA(v)}`;
  try{ const r=await aiCall(prompt,{json:true,tier:'complex'});
    const L=(a,t)=>Array.isArray(a)&&a.length?`<div class="sug"><b>${t}</b><ul style="margin:0;padding-left:18px">${a.map(x=>`<li>${esc(typeof x==='string'?x:(x.secao?x.secao+': ':'')+x.texto)}</li>`).join('')}</ul></div>`:'';
    box.innerHTML=`<h4>Parecer da revisão</h4>${L(r.inconsistencias,'Inconsistências encontradas')||'<div class="sug"><b>Inconsistências</b>Nenhuma apontada.</div>'}${L(r.pendencias_campo,'Pendências de campo')}${L(r.melhorias,'Melhorias sugeridas')}
     ${r.conclusao?`<div class="sug"><b>Conclusão sugerida</b>${esc(r.conclusao)}<div class="actions"><button class="btn sec" id="apConc">Usar como observação final</button></div></div>`:''}
     ${r.observacoes?`<div class="sug"><b>Observações finais sugeridas</b>${esc(r.observacoes)}<div class="actions"><button class="btn sec" id="apObs">Aplicar</button></div></div>`:''}
     ${r.resumo_executivo?`<div class="sug"><b>Resumo executivo para o síndico</b>${esc(r.resumo_executivo)}<div class="actions"><button class="btn sec" id="apRes">Incluir nas observações</button></div></div>`:''}
     <div class="actions"><button class="btn ghost" onclick="closeSheet()">Fechar</button></div>`;
    const add=t=>{ v.conclusao.obs=(v.conclusao.obs?v.conclusao.obs+'\n\n':'')+t; save(true); closeSheet(); render(); toast('Aplicado às observações finais'); };
    const b1=$('#apConc'); if(b1) b1.onclick=()=>add(r.conclusao); const b2=$('#apObs'); if(b2) b2.onclick=()=>{ v.conclusao.obs=r.observacoes; save(true); closeSheet(); render(); toast('Observações aplicadas'); }; const b3=$('#apRes'); if(b3) b3.onclick=()=>add('Resumo executivo: '+r.resumo_executivo);
  }catch(e){ box.innerHTML=`<h4>Não foi possível</h4><p class="small">${esc(aiErr(e))}</p>`; }
}
function aiChat(){
  const v=S.cur; const turns=[]; let ctl=null;
  openSheet(`<h2>Perguntar à IA sobre este laudo</h2><p class="muted small">A IA lê o laudo atual (sem fotos) e responde. Exemplos: "redija o item 10.2 de forma mais técnica", "quais normas se aplicam a guarda-corpo?", "monte o texto do e-mail para o síndico".</p><div class="chat" id="chat"></div><div class="field" style="margin-top:8px"><textarea id="chatIn" placeholder="Sua pergunta ou pedido"></textarea></div><div class="actions"><button class="btn ghost" onclick="closeSheet()">Fechar</button><button class="btn ghost" id="chatStop" hidden>Parar</button><button class="btn" id="chatSend">Enviar</button></div>`);
  const chat=$('#chat'); const add=(cls,t)=>{ const d=document.createElement('div'); d.className='m '+cls; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; };
  $('#chatStop').onclick=()=>ctl&&ctl.abort();
  $('#chatSend').onclick=async()=>{ const q=$('#chatIn').value.trim(); if(!q) return; $('#chatIn').value=''; add('u',q); turns.push({role:'user',content:q}); const a=add('a','Pensando…'); ctl=new AbortController(); $('#chatStop').hidden=false; $('#chatSend').disabled=true;
    try{ const input=[{role:'user',content:`${AI_PAPEL}\n\nVocê está ajudando a finalizar o laudo abaixo. Responda de forma direta; quando pedirem redação, entregue o texto pronto para colar.\n\nLAUDO ATUAL:\n${laudoTextoIA(v)}`},...turns];
      const text=await aiCall(input,{signal:ctl.signal,onText:({text})=>{ a.textContent=text; chat.scrollTop=chat.scrollHeight; }}); a.textContent=text; turns.push({role:'assistant',content:text}); const cp=document.createElement('button'); cp.className='btn ghost'; cp.style.cssText='margin-top:6px;padding:4px 8px;font-size:12px'; cp.textContent='Copiar'; cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(text); toast('Copiado'); }catch(e){} }; a.appendChild(document.createElement('br')); a.appendChild(cp); }
    catch(e){ a.textContent=(e&&e.text)||aiErr(e); }
    finally{ $('#chatStop').hidden=true; $('#chatSend').disabled=false; } };
}
function aiForm(){ const p=aiProv(); return `<div class="field"><label class="f" for="aiProv">Provedor</label><select id="aiProv">${Object.entries(PROVS).map(([k,x])=>`<option value="${k}" ${AICFG.prov===k?'selected':''}>${x.nome}</option>`).join('')}</select></div>
   <div class="field"><label class="f" for="aiKey">Chave da API (<span id="aiSite">${p.site}</span>)</label><input id="aiKey" type="text" value="${esc(AICFG.key)}" placeholder="${p.ph}" autocomplete="off"></div>
   <div class="row"><div class="field"><label class="f" for="aiModel">Modelo</label><input id="aiModel" type="text" value="${esc(AICFG.model)}" placeholder="${p.model}"></div><div class="field"><label class="f" for="aiBase">Endpoint (opcional)</label><input id="aiBase" type="text" value="${esc(AICFG.base)}" placeholder="${p.base}"></div></div>
   <p class="hint">A chave fica salva só neste aparelho e cada uso consome créditos da sua conta. Deixe modelo e endpoint em branco para usar o padrão do provedor.</p>`; }
function aiBind(root){ const grab=()=>{ AICFG.prov=root.querySelector('#aiProv').value; AICFG.key=root.querySelector('#aiKey').value.trim(); AICFG.model=root.querySelector('#aiModel').value.trim(); AICFG.base=root.querySelector('#aiBase').value.trim(); };
  root.querySelector('#aiProv').onchange=()=>{ grab(); const p=aiProv(); root.querySelector('#aiSite').textContent=p.site; root.querySelector('#aiKey').placeholder=p.ph; root.querySelector('#aiModel').placeholder=p.model; root.querySelector('#aiBase').placeholder=p.base; };
  root.querySelector('#aiTest').onclick=async()=>{ grab(); const b=root.querySelector('#aiTest'); b.disabled=true; b.textContent='Testando…'; try{ const t=await aiCall('Responda apenas: OK',{tier:'quick'}); toast('Resposta: '+String(t).slice(0,40)); }catch(e){ toast(aiErr(e)); } b.disabled=false; b.textContent='Testar'; };
  return grab; }
function aiSettings(){
  openSheet(`<h2>Integração de IA</h2><div class="stripe ${aiReady()?'ok':'warn'}">${AICFG.key?'Usando a sua chave: '+aiMode()+'.':(AIS?'Usando a conta do claude.ai de quem está visualizando. Informe uma chave para usar a sua própria.':'Informe uma chave da API para ativar a IA.')}</div>${aiForm()}
   <div class="actions"><button class="btn ghost" onclick="closeSheet()">Fechar</button><button class="btn sec" id="aiTest">Testar</button><button class="btn" id="aiSave">Salvar</button></div>`);
  const grab=aiBind($('#sheet')); $('#aiSave').onclick=()=>{ grab(); closeSheet(); if(S.screen==='integracoes') render(); toast(AICFG.key?'Chave salva':'Chave removida'); };
}
document.getElementById('btnAI').onclick=aiSettings;

  render();
  if(window.claude&&typeof claude.use==='function'){

    claude.use('user').then(u=>{ USR=u; }).catch(()=>{});
    claude.use('db').then(d=>{ DBX=d; if(d) cloudLoad(); }).catch(()=>{});

  }
})();
